[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "meeting-copilot-prototype"
version = "0.1.0"
description = "Local evidence snapshots and private meeting QA"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2", "litellm>=1.80,<2", "mcp>=2.3,<3", "aiofiles>=24,<26", "numpy>=1.26,<3"]
[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2", "av>=16,<17", "sounddevice>=0.5,<1; sys_platform != 'win32'", "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[project.scripts]
meeting-copilot = "meeting_copilot.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/meeting_copilot", "src/local_meeting_ai"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
